
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Program Menampilkan Waktu</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #eaf6fc;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .jam-card {
            background: white;
            width: 100%;
            max-width: 450px;
            padding: 35px 20px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .jam {
            font-size: clamp(38px, 12vw, 60px);
            font-weight: bold;
            color: #1870f5;
            margin: 20px 0;
        }

        .tanggal {
            color: #555;
            font-size: 17px;
        }

        .label {
            color: #777;
        }
    </style>
</head>

<body>

    <div class="jam-card">
        <h2 class="fw-bold">Jam Digital</h2>
        <p class="label">Waktu Saat Ini</p>

        <div id="jam" class="jam">00:00:00</div>

        <div id="tanggal" class="tanggal"></div>

        <hr>

        <p class="text-secondary mb-0">
            Program HTML dan JavaScript
        </p>
    </div>

    <script>
        function tampilkanWaktu() {
            // Mengambil waktu sekarang
            const sekarang = new Date();

            // Mengambil jam, menit, dan detik
            const jam = String(sekarang.getHours()).padStart(2, "0");
            const menit = String(sekarang.getMinutes()).padStart(2, "0");
            const detik = String(sekarang.getSeconds()).padStart(2, "0");

            // Menampilkan waktu
            document.getElementById("jam").textContent =
                jam + ":" + menit + ":" + detik;

            // Menampilkan tanggal
            document.getElementById("tanggal").textContent =
                sekarang.toLocaleDateString("id-ID", {
                    weekday: "long",
                    day: "numeric",
                    month: "long",
                    year: "numeric"
                });
        }

        // Menampilkan waktu pertama kali
        tampilkanWaktu();

        // Memperbarui waktu setiap 1 detik
        setInterval(tampilkanWaktu, 1000);
    </script>

</body>
</html>
