<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Aritmatika</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 40px 15px;
            min-height: 100vh;
            background-color: #f8f9fa;
            font-family: Arial, sans-serif;
        }

        .calculator {
            max-width: 805px;
            margin: 35px auto;
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.16);
        }

        .calculator-header {
            background-color: #0d6efd;
            color: white;
            text-align: center;
            padding: 17px 15px 15px;
        }

        .calculator-header h1 {
            font-size: 42px;
            font-weight: 400;
            margin: 0 0 12px;
        }

        .identity {
            display: inline;
            background-color: white;
            color: #3979a5;
            font-size: 23px;
            line-height: 1.5;
        }

        .calculator-body {
            padding: 42px 39px 39px;
        }

        .form-label {
            font-size: 24px;
            margin-bottom: 14px;
            color: #343a40;
        }

        .form-control,
        .form-select {
            height: 60px;
            border-radius: 10px;
            font-size: 23px;
            padding: 10px 18px;
            border: 1px solid #dee2e6;
        }

        .form-select {
            cursor: pointer;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #86b7fe;
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.15);
        }

        .form-group {
            margin-bottom: 29px;
        }

        .btn-hitung {
            height: 60px;
            font-size: 24px;
            border-radius: 9px;
            background-color: #0d6efd;
            border-color: #0d6efd;
        }

        .btn-hitung:hover {
            background-color: #0b5ed7;
        }

        .result-box {
            margin-top: 39px;
            background-color: #212529;
            color: white;
            text-align: center;
            border-radius: 10px;
            padding: 30px 15px;
            min-height: 193px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .result-title {
            font-size: 20px;
            margin-bottom: 12px;
        }

        .result-value {
            font-size: 88px;
            font-weight: bold;
            line-height: 1.1;
            overflow-wrap: anywhere;
        }

        .footer {
            text-align: center;
            color: #6c757d;
            font-size: 13px;
            padding: 0 15px 20px;
        }

        @media (max-width: 576px) {
            body {
                padding: 15px 10px;
            }

            .calculator {
                margin: 10px auto;
            }

            .calculator-header h1 {
                font-size: 29px;
            }

            .identity {
                font-size: 15px;
            }

            .calculator-body {
                padding: 27px 20px;
            }

            .form-label {
                font-size: 19px;
            }

            .form-control,
            .form-select {
                height: 53px;
                font-size: 18px;
            }

            .btn-hitung {
                height: 54px;
                font-size: 20px;
            }

            .result-box {
                min-height: 160px;
                margin-top: 30px;
            }

            .result-title {
                font-size: 17px;
            }

            .result-value {
                font-size: 65px;
            }
        }
    </style>
</head>

<body>

    <div class="calculator">

        <!-- Header Kalkulator -->
        <div class="calculator-header">
            <h1>Kalkulator Aritmatika</h1>
            <span class="identity">
                Adly Zaidan Zidna Fann - NIM. 262302009
            </span>
        </div>

        <!-- Form Kalkulator -->
        <div class="calculator-body">

            <div class="form-group">
                <label for="angka1" class="form-label">
                    Angka Pertama
                </label>
                <input
                    type="number"
                    id="angka1"
                    class="form-control"
                    value="3"
                    step="any"
                    placeholder="Masukkan angka pertama"
                >
            </div>

            <div class="form-group">
                <label for="angka2" class="form-label">
                    Angka Kedua
                </label>
                <input
                    type="number"
                    id="angka2"
                    class="form-control"
                    value="5"
                    step="any"
                    placeholder="Masukkan angka kedua"
                >
            </div>

            <div class="form-group">
                <label for="operator" class="form-label">
                    Pilih Operator
                </label>

                <select id="operator" class="form-select">
                    <option value="+">Penjumlahan (+)</option>
                    <option value="-">Pengurangan (-)</option>
                    <option value="*">Perkalian (*)</option>
                    <option value="/">Pembagian (/)</option>
                    <option value="**" selected>Pangkat (**)</option>
                    <option value="%">Modulus (%)</option>
                    <option value="==">Sama dengan (==)</option>
                    <option value="===">Sama persis (===)</option>
                    <option value="!=">Tidak sama dengan (!=)</option>
                    <option value="!==">Tidak sama persis (!==)</option>
                    <option value=">">Lebih besar dari (>)</option>
                    <option value="<">Lebih kecil dari (<)</option>
                    <option value=">=">Lebih besar atau sama dengan (>=)</option>
                    <option value="<=">Lebih kecil atau sama dengan (<=)</option>
                </select>
            </div>

            <!-- Tombol Hitung -->
            <button
                type="button"
                class="btn btn-primary w-100 btn-hitung"
                onclick="hitung()"
            >
                Hitung
            </button>

            <!-- Hasil Perhitungan -->
            <div class="result-box">
                <div class="result-title">HASIL PERHITUNGAN</div>
                <div class="result-value" id="hasil">0</div>
                <div id="detail" class="mt-2"></div>
            </div>

        </div>

        <div class="footer">
            Kalkulator Aritmatika | Adly Zaidan Zidna Fann
        </div>

    </div>

    <!-- JavaScript -->
    <script>
        function hitung() {
            const nilai1 = document.getElementById("angka1").value;
            const nilai2 = document.getElementById("angka2").value;
            const operator = document.getElementById("operator").value;

            const hasilElement = document.getElementById("hasil");
            const detailElement = document.getElementById("detail");

            if (nilai1.trim() === "" || nilai2.trim() === "") {
                hasilElement.textContent = "!";
                detailElement.textContent = "Masukkan kedua angka terlebih dahulu.";
                return;
            }

            const a = Number(nilai1);
            const b = Number(nilai2);
            let hasil;

            switch (operator) {
                case "+":
                    hasil = a + b;
                    break;
                case "-":
                    hasil = a - b;
                    break;
                case "*":
                    hasil = a * b;
                    break;
                case "/":
                    if (b === 0) {
                        hasilElement.textContent = "Error";
                        detailElement.textContent = "Tidak bisa membagi dengan nol.";
                        return;
                    }
                    hasil = a / b;
                    break;
                case "**":
                    hasil = a ** b;
                    break;
                case "%":
                    if (b === 0) {
                        hasilElement.textContent = "Error";
                        detailElement.textContent = "Modulus dengan nol tidak diperbolehkan.";
                        return;
                    }
                    hasil = a % b;
                    break;
                case "==":
                    hasil = a == b;
                    break;
                case "===":
                    hasil = a === b;
                    break;
                case "!=":
                    hasil = a != b;
                    break;
                case "!==":
                    hasil = a !== b;
                    break;
                case ">":
                    hasil = a > b;
                    break;
                case "<":
                    hasil = a < b;
                    break;
                case ">=":
                    hasil = a >= b;
                    break;
                case "<=":
                    hasil = a <= b;
                    break;
                default:
                    hasil = "Operator tidak valid";
            }

            if (typeof hasil === "number" && !Number.isFinite(hasil)) {
                hasilElement.textContent = "Error";
                detailElement.textContent = "Hasil tidak dapat ditampilkan.";
                return;
            }

            if (typeof hasil === "number") {
                hasil = Number(hasil.toPrecision(12));
            }

            hasilElement.textContent = hasil;
            detailElement.textContent = `${a} ${operator} ${b}`;
        }
    </script>

</body>
</html>
