
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Algorithm Castle | UTS Adly</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:22px;background:linear-gradient(140deg,#172554,#1e40af,#60a5fa);font-family:Arial,sans-serif;color:#172554}.wrap{max-width:700px;margin:15px auto}.card{background:white;border-radius:25px;overflow:hidden;box-shadow:0 18px 45px #0003}.header{text-align:center;padding:26px 18px;background:linear-gradient(135deg,#fbbf24,#f97316);color:#431407}.header .emoji{font-size:48px}.header h1{margin:8px 0;font-size:clamp(25px,5vw,36px)}.identity{display:inline-block;background:#fff7ed;padding:7px 12px;border-radius:9px;font-size:14px}.body{padding:25px}.tag{font-size:12px;font-weight:bold;letter-spacing:2px;color:#64748b;text-align:center}label{display:block;font-weight:bold;margin:17px 0 8px}input,select{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:11px;font-size:16px;background:white}button,.back{display:block;width:100%;padding:13px;border:0;border-radius:12px;background:#1d4ed8;color:white;font-weight:bold;text-align:center;text-decoration:none;margin-top:19px;cursor:pointer}.result{margin-top:23px;border-radius:17px;padding:22px;background:#172554;color:white;text-align:center;overflow-wrap:anywhere}.value{font-size:clamp(38px,10vw,65px);font-weight:900;margin:12px 0}.detail{color:#bfdbfe;line-height:1.6}.back{background:#fef3c7;color:#78350f}.error{color:#b91c1c;margin-top:10px}
</style>
</head>
<body>
<main class="wrap">
 <section class="card">
  <header class="header">
   <div class="emoji">🏰💎</div>
   <h1>Algorithm Castle</h1>
   <div class="identity">Adly Zaidan Zidna Fann · NIM 262302009</div>
  </header>

  <div class="body">
   <div class="tag">FINAL MISSION · UTS ALGORITMA</div>
   <p style="text-align:center;color:#64748b;line-height:1.6">Kalahkan boss terakhir dengan kekuatan operator JavaScript!</p>

   <label for="angka1">🔢 Angka pertama</label>
   <input type="number" id="angka1" value="3" step="any">

   <label for="angka2">🔢 Angka kedua</label>
   <input type="number" id="angka2" value="5" step="any">

   <label for="operator">⚙️ Pilih operator</label>
   <select id="operator">
    <optgroup label="Operator Aritmatika">
     <option value="+">Penjumlahan (+)</option>
     <option value="-">Pengurangan (-)</option>
     <option value="*">Perkalian (*)</option>
     <option value="/">Pembagian (/)</option>
     <option value="**" selected>Pangkat (**)</option>
     <option value="%">Modulus (%)</option>
    </optgroup>
    <optgroup label="Operator Perbandingan">
     <option value="==">Sama dengan (==)</option>
     <option value="===">Sama persis (===)</option>
     <option value="!=">Tidak sama dengan (!=)</option>
     <option value="!==">Tidak sama persis (!==)</option>
     <option value=">">Lebih besar (&gt;)</option>
     <option value="<">Lebih kecil (&lt;)</option>
     <option value=">=">Lebih besar atau sama (&gt;=)</option>
     <option value="<=">Lebih kecil atau sama (&lt;=)</option>
    </optgroup>
   </select>

   <button onclick="hitung()">⚔️ Serang dengan Hitungan!</button>
   <div id="error" class="error" role="alert"></div>

   <div class="result" aria-live="polite">
    <div>🏆 HASIL PERTARUNGAN</div>
    <div id="hasil" class="value">125</div>
    <div id="detail" class="detail">3 ** 5 = 125</div>
   </div>

   <a class="back" href="index.html">🗺️ Kembali ke Peta Petualangan</a>
  </div>
 </section>
</main>
<script>
function hitung(){
 const x=document.getElementById("angka1").value;
 const y=document.getElementById("angka2").value;
 const op=document.getElementById("operator").value;
 const out=document.getElementById("hasil");
 const detail=document.getElementById("detail");
 const error=document.getElementById("error");
 error.textContent="";

 if(x===""||y===""){
  out.textContent="!";
  detail.textContent="Masukkan kedua angka terlebih dahulu.";
  return;
 }
 const a=Number(x),b=Number(y);
 let result;

 switch(op){
  case "+":result=a+b;break;
  case "-":result=a-b;break;
  case "*":result=a*b;break;
  case "/":
   if(b===0){out.textContent="Error";detail.textContent="Tidak dapat membagi dengan nol.";return}
   result=a/b;break;
  case "**":result=a**b;break;
  case "%":
   if(b===0){out.textContent="Error";detail.textContent="Modulus dengan nol tidak diperbolehkan.";return}
   result=a%b;break;
  case "==":result=a==b;break;
  case "===":result=a===b;break;
  case "!=":result=a!=b;break;
  case "!==":result=a!==b;break;
  case ">":result=a>b;break;
  case "<":result=a<b;break;
  case ">=":result=a>=b;break;
  case "<=":result=a<=b;break;
  default:out.textContent="Error";detail.textContent="Operator tidak valid.";return;
 }

 if(typeof result==="number"&&!Number.isFinite(result)){
  out.textContent="Error";
  detail.textContent="Hasil tidak dapat ditampilkan.";
  return;
 }
 if(typeof result==="number")result=Number(result.toPrecision(12));
 out.textContent=String(result);
 detail.textContent=a+" "+op+" "+b+" = "+String(result);
}
hitung();
</script>
</body>
</html>
