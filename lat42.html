
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Usia Adly</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #eaf6fc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
        }

        .card-usia {
            background: white;
            width: 100%;
            max-width: 500px;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: #1870f5;
            font-weight: bold;
        }

        #hasil {
            background: #eaf6fc;
            border-radius: 15px;
            padding: 18px;
            margin-top: 20px;
            color: #164e9b;
            font-size: 17px;
            line-height: 1.7;
        }
    </style>
</head>

<body>

    <div class="card-usia">
        <h2 class="text-center mb-4">Kalkulator Usia</h2>

        <label for="tanggalLahir" class="form-label fw-bold">
            Tanggal lahir kamu:
        </label>

        <input
            type="date"
            id="tanggalLahir"
            class="form-control form-control-lg"
            value="2007-10-22"
            max="2026-10-12"
        >

        <p id="hasil" aria-live="polite">
            Kamu sudah berusia 18 tahun 11 bulan 20 hari.
        </p>
    </div>

    <script>
        const inputTanggal = document.getElementById("tanggalLahir");
        const hasil = document.getElementById("hasil");

        function hitungUsia() {
            if (inputTanggal.value === "") {
                hasil.textContent = "Silakan pilih tanggal lahir kamu.";
                return;
            }

            const bagian = inputTanggal.value.split("-").map(Number);
            const tahunLahir = bagian[0];
            const bulanLahir = bagian[1];
            const hariLahir = bagian[2];

            const sekarang = new Date();
            const tahunSekarang = sekarang.getFullYear();
            const bulanSekarang = sekarang.getMonth() + 1;
            const hariSekarang = sekarang.getDate();

            // Membuat tanggal lahir lokal
            const lahir = new Date(
                tahunLahir, bulanLahir - 1, hariLahir
            );

            // Menolak tanggal lahir yang belum terjadi
            const hariIni = new Date(
                tahunSekarang, bulanSekarang - 1, hariSekarang
            );

            if (lahir > hariIni) {
                hasil.textContent =
                    "Tanggal lahir tidak boleh di masa depan.";
                return;
            }

            // Menghitung selisih tahun, bulan, dan hari
            let tahun = tahunSekarang - tahunLahir;
            let bulan = bulanSekarang - bulanLahir;
            let hari = hariSekarang - hariLahir;

            if (hari < 0) {
                bulan--;

                // Jumlah hari pada bulan sebelumnya
                const hariBulanSebelumnya = new Date(
                    tahunSekarang, bulanSekarang - 1, 0
                ).getDate();

                hari += hariBulanSebelumnya;
            }

            if (bulan < 0) {
                tahun--;
                bulan += 12;
            }

            hasil.textContent =
                `Kamu sudah berusia ${tahun} tahun ` +
                `${bulan} bulan ${hari} hari.`;
        }

        // Hitung saat halaman dibuka
        hitungUsia();

        // Hitung ulang saat tanggal berubah
        inputTanggal.addEventListener("input", hitungUsia);
        inputTanggal.addEventListener("change", hitungUsia);
    </script>

</body>
</html>
